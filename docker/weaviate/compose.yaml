# Weaviate — candidato de D12.
# Adaptado de ../sesion_03/deploy/weaviate/compose.yaml (condición 4 del plan).
name: aurum-market-weaviate
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.2
    container_name: aurum-market-weaviate
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080"    # REST
      - "50051:50051"  # gRPC, que el cliente v4 usa para búsqueda e ingesta
    volumes:
      - weaviate-data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      # Los vectores los trae el proyecto ya calculados (gemini-embedding-2 @768).
      # Que el motor no vectorice es requisito, no preferencia: si vectorizara él,
      # la comparativa mediría su modelo y no su índice.
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: aurum-market-weaviate-node
      DISABLE_TELEMETRY: "true"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  weaviate-data:
    name: aurum-market-weaviate-data

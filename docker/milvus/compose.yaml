# Milvus — candidato de D12.
# Adaptado de ../sesion_03/deploy/milvus/compose.yaml (condición 4 del plan).
#
# ⚠️ Son TRES contenedores (etcd + minio + standalone) donde los otros dos
# candidatos son uno. El plan lo marca como pesado para 7,9 GB: levántalo con
# Qdrant y Weaviate apagados, y anota en el paso 10 la RAM de los tres sumados,
# no solo la de `standalone` -es lo que de verdad cuesta tenerlo en marcha.
name: aurum-market-milvus
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: aurum-market-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - milvus-etcd:/etcd
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: aurum-market-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus-minio:/minio_data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  standalone:
    image: milvusdb/milvus:v2.6.18
    container_name: aurum-market-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"  # gRPC, el que usa pymilvus
      - "9091:9091"    # métricas y healthz
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Interfaz web para inspeccionar la colección a ojo (http://localhost:8000).
  # Es el equivalente del dashboard que Qdrant trae incorporado en :6333.
  #
  # ⚠️ NO cuenta para el paso 10 del guion. Attu es una herramienta de
  # inspección, no parte del motor: sumar su RAM haría que Milvus pareciera más
  # caro de lo que es frente a Qdrant -que sirve su panel desde el mismo proceso-
  # y frente a Weaviate, que no trae ninguno. Al anotar recursos, cuenta etcd +
  # minio + standalone y deja fuera este contenedor.
  attu:
    image: zilliz/attu:v2.5     # v2.x para Milvus 2.x; la v3 es para Milvus 3.x
    container_name: aurum-market-milvus-attu
    ports:
      - "8000:3000"
    environment:
      # El host es el nombre del SERVICIO en la red interna de compose, que aquí
      # es `standalone` y no `milvus` -ese es el container_name, que no resuelve
      # entre servicios-.
      MILVUS_URL: standalone:19530
    depends_on:
      standalone:
        condition: service_healthy
    mem_limit: 512m

volumes:
  milvus-etcd:
    name: aurum-market-milvus-etcd
  milvus-minio:
    name: aurum-market-milvus-minio
  milvus-data:
    name: aurum-market-milvus-data
